[project]
name = "lextrack-sorting"
version = "0.1.0"
description = "Módulo de ordenação multicritério para dados legislativos (LexTrack) - Trabalho 2 de EDA2 (2026.2)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "G45 - EDA2" }
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -v"

[tool.ruff]
line-length = 100
target-version = "py311"
